[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartadvisor-discovery"
version = "0.1.0"
description = "Read-only SmartAdvisor control discovery utility for Citrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywinauto==0.6.9",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.20,<7",
    "pytest>=9,<10",
]

[project.scripts]
smartadvisor-discovery = "smartadvisor_discovery.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

