[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartadvisor-automation"
version = "0.3.5"
description = "Attended SmartAdvisor No Bill on File automation for Citrix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywinauto==0.6.9",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.20,<7",
    "pytest>=9,<10",
]

[project.scripts]
smartadvisor-automation = "smartadvisor_automation.app:main"
smartadvisor-object-extractor = "smartadvisor_automation.object_extractor_app:main"
smartadvisor-control-picker = "smartadvisor_automation.control_picker_app:main"
smartadvisor-action-recorder = "smartadvisor_automation.action_recorder_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

