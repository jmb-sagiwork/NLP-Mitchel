[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage"
version = "0.2.8"
description = "Offline email concern classification and field extraction"
requires-python = ">=3.11,<3.15"
dependencies = [
    "selenium>=4.25,<5",
]

[project.optional-dependencies]
# Layer 3. The engine runs without these on rules + structural only.
embeddings = ["onnxruntime>=1.24", "numpy>=1.26", "tokenizers>=0.19"]
# Optional convenience only. Never import at module scope.
frames = ["pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]
smartadvisor = ["pywinauto==0.6.9"]
build = ["pyinstaller>=6.20,<7"]

[project.scripts]
email-triage = "email_triage.__main__:main"
email-triage-ui = "email_triage_ui.__main__:main"
mitchel-nlp = "mitchel_pipeline.__main__:main"

# Two distributions in one repo on purpose: `email_triage` is what a host app
# imports, `email_triage_ui` is the teaching harness. Nothing in the engine
# imports the UI, so a host can vendor or install the first one alone.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_triage = ["resources/*.json", "resources/model/*"]

[tool.ruff]
# Source must stay compatible with the oldest supported interpreter,
# even though development happens on 3.14. See pipeline SP-1.1-01.
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
